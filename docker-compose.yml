services:
  postgres:
    image: postgres:16
    container_name: promo-lift-postgres
    environment:
      POSTGRES_USER: promo
      POSTGRES_PASSWORD: promo
      POSTGRES_DB: promo_lift
    ports:
      - "5432:5432"
    volumes:
      - promo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo -d promo_lift"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  promo_pg:
