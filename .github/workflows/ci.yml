name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promo
          POSTGRES_PASSWORD: promo
          POSTGRES_DB: promo_lift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promo -d promo_lift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://promo:promo@localhost:5432/promo_lift
      FULL_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Load fixtures
        run: python scripts/ingest.py --source fixtures
      - name: Build
        run: python scripts/build.py
      - name: Test
        run: python -m pytest -q
      - name: Export
        run: python scripts/export.py
